  <head>
    <meta charset="UTF-8" />

    <title>EWlearn</title>

    <link
      rel="stylesheet"

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <link rel="stylesheet" href="../styles/instructors/instructor.css" />
    <link rel="stylesheet" href="../styles/Home/home.css" />
  </head>
  <body>
    <!-- Include the navigation bar -->
    <div id="navbar-container"></div>
    <script>
      $("#navbar-container").load("./navbar.html");
    </script>
    <div id="welcome"></div>
    <script>
      $("#welcome").load("./WelcomeImages.html");
    </script>

    <div class="intro">
      <h2>
        <span>Instructor Cards</span>
      </h2>
      <h4>
        Meet our experienced instructors who share their expertise, practical knowledge, and passion to create an effective learning environment for students.
      </h4>
    </div>

    <div class="search-bar">
      <!-- Dropdown start -->
      <div class="dropdown">
        <div id="drop-text" class="dropdown-text">
          <span id="span">Everything</span>
          <i id="icon" class="fa-solid fa-chevron-down"></i>
        </div>
        <ul id="list" class="dropdown-list">
          <li class="dropdown-list-item" data-value="Everything">Everything</li>
          <!-- Populated with the real course categories taught by real instructors. -->
        </ul>
      </div>
      <!-- Dropdown ends -->

      <!-- Search box input start -->
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search anything..." />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <!-- Search box input ends -->
    </div>
    <section class="container instcard">
      <div class="no-cards-message" style="display: none">
        No matching cards found.
      </div>
      <div
        class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4"
        id="instructorCards"
      >
        <!-- Populated from real instructor data by instructor.js -->
      </div>
    </section>

    <div class="dropdown_menu">
      <a href="../index/Home.html"><i class="fas fa-home"></i>Home</a>
      <a href="#about"><i class="fas fa-info-circle"></i>About</a>
      <a href="#courses"><i class="fas fa-book"></i>Courses</a>
      <a href="../index/Instructor.html"
        ><i class="fas fa-chalkboard-teacher"></i>Instructors</a
      >
      <a href="#events"><i class="fas fa-calendar-alt"></i>Events</a>
      <a href="#contact"><i class="fas fa-envelope"></i>Contact</a>
      <a href="#contact" class="search"
        ><i class="fa-solid fa-magnifying-glass"></i
      ></a>
    </div>
    <!-- Include the footer -->
    <div id="footer-container"></div>
    <script>
      $("#footer-container").load("Footer.html");
    </script>
    <!-- Include jQuery and Bootstrap JS scripts -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
    ></script>
