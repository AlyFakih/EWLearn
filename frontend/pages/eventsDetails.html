<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EWlearn</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <link rel="stylesheet" href="../styles/bstyle.css" type="text/css" />
    <link rel="stylesheet" href="../styles/events/eventsDetails.css" />
  </head>
  <body>
    <div id="navbar-container"></div>
    <script>
      $("#navbar-container").load("./navbar.html");
    </script>

    <section
      class="blog-hero-section set-bg"
      id="eventHero"
      data-setbg="../assets/images/contact-content-bg.jpg"
    >
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="bh-text">
              <h2 id="eventTitle">Loading event...</h2>
              <ul>
                <li id="eventDate"></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="blog-details-section">
      <div class="container">
        <div class="row">
          <div class="col-lg-8 m-auto">
            <div class="bd-text">
              <div class="bd-title">
                <p id="eventSummary"></p>
              </div>
              <p id="eventDescriptionWrap" style="display: none" class="bd-more-text">
                <span id="eventDescription"></span>
              </p>
              <p><a href="./Events.html">&larr; Back to Events</a></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="footer-container"></div>
    <script>
      $("#footer-container").load("Footer.html");
    </script>
    <script src="../javascript/eventDetails.js"></script>
  </body>
</html>
