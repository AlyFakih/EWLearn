; PHP-core, per-directory config file - the portable equivalent of the
; php_flag lines in the root .htaccess, for hosts that run PHP via
; CGI/FastCGI/PHP-FPM rather than as an Apache module (mod_php).
;
; .htaccess's `php_flag` directives ONLY work under mod_php - under
; CGI/FastCGI/FPM they are not recognized by Apache at all and cause a
; hard 500 Internal Server Error for every request under that .htaccess's
; scope. .user.ini is the inverse: read by PHP itself under CGI/FastCGI/FPM,
; but never scanned at all under mod_php (confirmed: this file has zero
; effect on this project's local XAMPP/mod_php dev environment).
;
; Kept alongside (not instead of) the .htaccess php_flag lines until the
; actual production host's PHP SAPI is confirmed - see docs/ARCHITECTURE.md
; deployment notes. If the host turns out to run mod_php, this file is
; simply inert there and the .htaccess lines keep doing the work.
display_errors = Off
display_startup_errors = Off
log_errors = On
